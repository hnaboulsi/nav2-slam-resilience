name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    name: Pure-Python unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml pytest ruff

      - name: Install package
        run: pip install -e . --no-deps

      - name: Lint
        run: ruff check nav2_slam_resilience tests

      - name: Format check
        run: ruff format --check nav2_slam_resilience tests

      - name: Unit tests
        run: pytest tests/unit -q
